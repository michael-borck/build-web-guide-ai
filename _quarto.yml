project:
  type: book
  output-dir: _book
  resources:
    - LICENSE
    - LICENSE-CONTENT.md
    - LICENSE-CODE.md
    - tools/**

book:
  cover-image: cover.png
  title: "Build Web, Guide AI"
  subtitle: "Business Web Development with AI"
  author: "Michael Borck"
  isbn: "979-8-255-17415-7"
  date: "last-modified"
  license: "CC BY 4.0 International"
  description: "A practical approach to web development that teaches you to specify, direct, check and hand over AI-built business websites with HTML, CSS, JavaScript, WordPress and React."
  favicon: favicon.svg
  site-url: https://michael-borck.github.io/build-web-guide-ai
  repo-url: https://github.com/michael-borck/build-web-guide-ai
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - copyright.qmd
    - chapters/reading-list.qmd
    - acknowledgments.qmd
    - part: "Your AI Development Partnership"
      chapters:
        - chapters/chapter-ai-web-partner.qmd
    - part: "The Practice Spine"
      chapters:
        - chapters/chapter-specify-before-build.qmd
        - chapters/chapter-checks-that-run.qmd
        - chapters/chapter-agent-ready-repo.qmd
    - part: "Web Foundations"
      chapters:
        - chapters/chapter-structure.qmd
        - chapters/chapter-presentation.qmd
        - chapters/chapter-behaviour.qmd
        - chapters/chapter-connection.qmd
        - projects/project-portfolio.qmd
    - part: "Content Management for Business"
      chapters:
        - chapters/chapter-why-cms.qmd
        - chapters/chapter-wordpress-platform.qmd
        - chapters/chapter-extending-platforms.qmd
        - chapters/chapter-headless-architecture.qmd
        - projects/project-business-site.qmd
    - part: "Modern Frontend Development"
      chapters:
        - chapters/chapter-component-thinking.qmd
        - chapters/chapter-rapid-development.qmd
        - chapters/chapter-professional-practices.qmd
        - projects/project-react-integration.qmd
    - part: "The Professional Developer"
      chapters:
        - chapters/chapter-emerging-technologies.qmd
        - chapters/chapter-development-career.qmd
        - chapters/chapter-ai-era-developer.qmd
    - part: "Appendices"
      chapters:
        - appendices/how-to-use-this-book.qmd
        - appendices/2027-course-map.qmd
    - references.qmd
    - about-author.qmd
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    footer: Paperback ISBN 979-8-255-17415-7
    tools:
      - icon: github
        href: https://github.com/michael-borck/build-web-guide-ai
  other-links:
    - text: Download PDF
      icon: file-pdf
      href: /build-web-guide-ai.pdf
    - text: Download EPUB
      icon: book
      href: /build-web-guide-ai.epub
    - text: Download llm.txt
      icon: robot
      href: llm.txt
    - text: GitHub
      icon: github
      href: https://github.com/michael-borck/build-web-guide-ai
    - text: DeepWiki
      icon: search
      href: https://deepwiki.com/michael-borck/build-web-guide-ai
    - text: All Books
      icon: collection
      href: https://books.borck.education

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: [assets/custom.css, book-design.css]
    cover-image: cover.png
    include-after-body: chatbot.html
    code-fold: false
    code-tools: true
    code-copy: hover
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-expand: 2
    number-sections: true
    number-depth: 2
    highlight-style: github
  pdf:
    pdf-engine: lualatex
    fontsize: 11pt
    linestretch: 1.08
    documentclass: book
    toc: true
    toc-depth: 1
    number-sections: true
    hyperrefoptions: draft
    geometry:
      - paperwidth=7in
      - paperheight=10in
      - inner=1in
      - outer=0.75in
      - top=0.75in
      - bottom=0.75in
    include-in-header: [pdf-header.tex, book-design.tex]
    include-before-body:
      - copyright-page.tex
  epub:
    epub-cover-image: cover.png
    toc: true
    toc-depth: 1
    css: [epub-styles.css, book-design-epub.css]

crossref:
  chapters: true
  fig-title: "Figure"
  tbl-title: "Table"

execute:
  echo: true
  warning: false
  error: false
